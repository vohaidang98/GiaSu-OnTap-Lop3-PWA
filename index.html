].map((r,i)=>({id:i+1,subject:r[0],skill:r[1],question:r[2],choices:r[3],answer:r[4],explain:r[5],source:r[6]}));
let state=load(),tab='home',session=null;function load(){try{return JSON.parse(localStorage.getItem(DBKEY))||{attempts:[],sessions:[]}}catch(e){return {attempts:[],sessions:[]}}}function save(){localStorage.setItem(DBKEY,JSON.stringify(state))}const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function p(n){return n?Math.round(n*100)+'%':'0%'}function stats(subject=null){let a=state.attempts.filter(x=>!subject||x.subject===subject);return {n:a.length,rate:a.length?a.filter(x=>x.correct).length/a.length:null}}function allSkills(subject){return [...new Set(bank.filter(q=>q.subject===subject).map(q=>q.skill))]}function skillStats(subject,skill){let a=state.attempts.filter(x=>x.subject===subject&&x.skill===skill);return {n:a.length,rate:a.length?a.filter(x=>x.correct).length/a.length:null}}function labelFor(s){return s.n<3?['Chưa đủ dữ liệu','warn']:s.rate>=.8?['Vững','good']:s.rate>=.6?['Đạt','warn']:['Cần ôn tập','bad']}function beep(correct){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=correct?880:330;g.gain.setValueAtTime(0.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.35)}catch(e){}}
function feedback(correct){if(state.soundOn!==false)beep(correct);const pop=document.createElement('div');pop.textContent=correct?'✅ Giỏi quá!':'💡 Cùng xem lại nhé';pop.style.cssText='position:fixed;left:50%;top:18%;transform:translate(-50%,-50%);font-size:22px;font-weight:800;background:'+(correct?'#def9ef':'#fff1cc')+';color:'+(correct?'#177a59':'#866217')+';padding:12px 20px;border-radius:16px;box-shadow:0 10px 30px #33406a33;z-index:999;pointer-events:none;transition:opacity .4s ease,transform .4s ease';document.body.appendChild(pop);requestAnimationFrame(()=>{pop.style.opacity='0';pop.style.transform='translate(-50%,-50%) translateY(-10px)'});setTimeout(()=>pop.remove(),650)}
function dayKey(d){return new Date(d).toLocaleDateString('vi-VN')}
function nav(t){tab=t;session=null;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>nav(b.dataset.tab));function render(){if(tab==='home')return home();if(tab==='test')return testPage();if(tab==='practice')return practicePage();if(tab==='parent')return parentPage()}
function home(){let total=stats();app.innerHTML=`<h2>Xin chào, Thảo Vy! 🌷</h2><div class="grid"><div class="card"><div class="small">Câu đã trả lời</div><div class="metric">${total.n}</div><div class="small">Tính cả kiểm tra và ôn tập</div></div><div class="card"><div class="small">Tỷ lệ trả lời đúng</div><div class="metric">${total.rate===null?'—':p(total.rate)}</div><div class="small">Chỉ số tham khảo, không phải điểm học kỳ</div></div><div class="card"><div class="small">Lần học gần nhất</div><div class="metric" style="font-size:21px">${total.n?esc(new Date(state.attempts.at(-1).date).toLocaleDateString('vi-VN')):'Chưa học'}</div><div class="small">Tiến độ được lưu ngay trên thiết bị</div></div></div><h2>Chọn môn học</h2><div class="grid">${Object.entries(subj).map(([k,v])=>`<div class="card"><h3>${v}</h3><p class="small">${bank.filter(q=>q.subject===k).length} câu hỏi mẫu • ${allSkills(k).length} nhóm kỹ năng</p><p><strong>${stats(k).rate===null?'Chưa đánh giá':p(stats(k).rate)+' đúng'}</strong></p><button class="primary" data-test="${k}">Bắt đầu kiểm tra</button></div>`).join('')}</div><h2>Quy trình học tập</h2><div class="card"><div class="pills">${['1. Kiểm tra','2. Phân tích kỹ năng','3. Ôn tập trọng tâm','4. Làm lại bài mới','5. Xem tiến bộ'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="notice">Bản thử nghiệm này chỉ đánh giá sơ bộ từ ngân hàng câu hỏi mẫu. Chưa thể kết luận năng lực tổng thể hoặc thay thế bài kiểm tra của giáo viên.</div></div>`;document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{tab='test';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='test'));start(b.dataset.test,'test')})}
function testPage(){if(session)return drawSession();app.innerHTML=`<h2>📝 Kiểm tra chẩn đoán</h2><div class="card"><p>Mỗi lượt có tối đa 12 câu, phân bố trên các nhóm kiến thức của môn đã chọn. Câu trả lời được ghi nhận để phụ huynh theo dõi.</p><div class="subject"><select id="subject"><option value="math">Toán</option><option value="vietnamese">Tiếng Việt</option><option value="english">Tiếng Anh</option></select><button class="primary" id="begin">Bắt đầu kiểm tra</button></div><p class="small">Câu hỏi được soạn mới theo chủ đề SGK. Bản thử nghiệm chưa có tự luận, nghe, nói hoặc chấm bài viết.</p></div>`;document.getElementById('begin').onclick=()=>start(document.getElementById('subject').value,'test')}
function pickBalanced(arr,n){const grouped={};arr.forEach(q=>(grouped[q.skill]??=[]).push(q));Object.values(grouped).forEach(v=>v.sort(()=>Math.random()-.5));let out=[];while(out.length<n&&Object.values(grouped).some(x=>x.length)){for(const g of Object.values(grouped)){if(g.length&&out.length<n)out.push(g.shift())}}return out}
function start(subject,mode,skill=null){let pool=bank.filter(q=>q.subject===subject&&(!skill||q.skill===skill));let qs=mode==='test'?pickBalanced(pool,Math.min(12,pool.length)):pool.sort(()=>Math.random()-.5).slice(0,Math.min(5,pool.length));session={subject,mode,skill,qs,index:0,answers:[],selected:null,finished:false};tab=mode==='test'?'test':'practice';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));drawSession()}
function drawSession(){if(session.finished)return drawFinish();let q=session.qs[session.index];app.innerHTML=`<h2>${session.mode==='test'?'📝 Kiểm tra':'🌱 Ôn tập'} · ${subj[session.subject]}</h2><div class="card"><div class="spread"><div class="small">Câu ${session.index+1} / ${session.qs.length}</div><span class="pill">${esc(q.skill)}</span></div><div class="line" style="margin:13px 0"><div style="width:${session.index/session.qs.length*100}%"></div></div><div class="question">${esc(q.question)}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice ${session.selected===i?'selected':''}" data-answer="${i}">${'ABCD'[i]}. ${esc(c)}</button>`).join('')}</div><div class="spread"><div class="small">${esc(q.source)}</div><button class="primary" id="next" ${session.selected===null?'disabled':''}>${session.index===session.qs.length-1?'Hoàn thành':'Câu tiếp theo →'}</button></div></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{session.selected=Number(b.dataset.answer);drawSession()});document.getElementById('next').onclick=()=>{if(session.selected===null)return;let q=session.qs[session.index];let a={id:q.id,subject:q.subject,skill:q.skill,correct:session.selected===q.answer,chosen:session.selected,date:new Date().toISOString(),mode:session.mode};feedback(a.correct);session.answers.push(a);state.attempts.push(a);save();session.index++;session.selected=null;if(session.index===session.qs.length){session.finished=true;state.sessions.push({date:new Date().toISOString(),subject:session.subject,mode:session.mode,correct:session.answers.filter(a=>a.correct).length,total:session.answers.length});save()}drawSession()}}
function drawFinish(){let right=session.answers.filter(x=>x.correct).length;let incorrect=session.answers.filter(x=>!x.correct);app.innerHTML=`<h2>🎉 Hoàn thành!</h2><div class="card"><div class="metric">${right}/${session.qs.length} câu đúng</div><p>${right===session.qs.length?'Rất tốt! Hãy thử một lượt bài mới.':'Mình cùng xem những chỗ cần luyện thêm nhé!'}</p><div class="notice">${session.mode==='test'?'Đây là kết quả lượt kiểm tra mẫu. Cần nhiều lượt và câu tự luận để đánh giá đầy đủ.':'Ôn tập xong! Hãy thử lại trong một lượt khác để kiểm tra khả năng ghi nhớ.'}</div><h3>Giải thích đáp án</h3>${session.qs.map((q,i)=>`<div class="result"><strong>Câu ${i+1}: ${session.answers[i].correct?'✅':'🔎'} ${esc(q.skill)}</strong><div>${esc(q.question)}</div><div class="small">Đáp án đúng: ${esc(q.choices[q.answer])}</div><div>${esc(q.explain)}</div></div>`).join('')}<div class="actions" style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" id="goPractice">Ôn tập kỹ năng</button><button class="secondary" id="goParent">Xem báo cáo phụ huynh</button><button class="secondary" id="again">Làm lượt khác</button></div></div>`;document.getElementById('goPractice').onclick=()=>nav('practice');document.getElementById('goParent').onclick=()=>nav('parent');document.getElementById('again').onclick=()=>start(session.subject,session.mode,session.skill)}
function practicePage(){if(session)return drawSession();let blocks=Object.keys(subj).map(s=>{let ss=allSkills(s).map(skill=>({skill,...skillStats(s,skill)})).sort((a,b)=>{let pa=a.n<3?-1:a.rate,pb=b.n<3?-1:b.rate;return pa-pb});return `<div class="card"><h3>${subj[s]}</h3>${ss.map(v=>{let tag=labelFor(v);return `<div class="skillrow"><div class="spread"><div><strong>${esc(v.skill)}</strong><div class="small">${v.n} lượt trả lời · ${v.rate===null?'Chưa có kết quả':p(v.rate)+' đúng'}</div></div><span class="tag ${tag[1]}">${tag[0]}</span></div><div class="spread" style="margin-top:10px"><div class="line" style="flex:1"><div style="width:${(v.rate||0)*100}%"></div></div><button class="secondary" data-practice="${s}" data-skill="${encodeURIComponent(v.skill)}">Luyện tập</button></div></div>`}).join('')}</div>`}).join('');app.innerHTML=`<h2>🌱 Bài ôn tập theo kỹ năng</h2><div class="notice">Các kỹ năng có ít hơn 3 lượt trả lời được đánh dấu “Chưa đủ dữ liệu”. Luyện tập hiện dùng câu hỏi mẫu mới trong cùng ngân hàng; chưa có khả năng tự tạo câu hỏi vô hạn hoặc tự luận.</div><div style="display:grid;gap:16px;margin-top:18px">${blocks}</div>`;document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>start(b.dataset.practice,'practice',decodeURIComponent(b.dataset.skill)))}
function parentPage(){let sessions=state.sessions.slice().reverse();let byDay={};state.sessions.forEach(s=>{const k=dayKey(s.date);(byDay[k]??=[]).push(s)});let dayRows=Object.entries(byDay).sort((a,b)=>new Date(b[1][0].date)-new Date(a[1][0].date)).slice(0,14).map(([k,arr])=>{let c=arr.reduce((s,x)=>s+x.correct,0),t=arr.reduce((s,x)=>s+x.total,0);return `<div class="skillrow spread"><div>${esc(k)}</div><div><strong>${c}/${t}</strong> <span class="small">(${arr.length} lượt)</span></div></div>`}).join('');let soundOn=state.soundOn!==false;app.innerHTML=`<h2>📈 Báo cáo dành cho phụ huynh</h2><div class="grid">${Object.entries(subj).map(([s,label])=>{let x=stats(s);return `<div class="card"><h3>${label}</h3><div class="metric">${x.rate===null?'—':p(x.rate)}</div><div class="small">${x.n} câu trả lời đã ghi nhận</div></div>`}).join('')}</div><h2>Bảng kỹ năng</h2><div class="card">${Object.entries(subj).map(([s,label])=>`<h3>${label}</h3>${allSkills(s).map(skill=>{let st=skillStats(s,skill),tag=labelFor(st);return `<div class="skillrow"><div class="spread"><strong>${esc(skill)}</strong><span class="tag ${tag[1]}">${tag[0]}</span></div><div class="small">${st.n} câu · ${st.rate===null?'Chưa có dữ liệu':p(st.rate)+' đúng'}</div></div>`}).join('')}`).join('')}</div><h2>Tiến độ theo ngày</h2><div class="card">${dayRows||'<p class="small">Chưa có lượt học nào.</p>'}</div><h2>Lịch sử học (chi tiết)</h2><div class="card">${sessions.length?sessions.slice(0,20).map(s=>`<div class="skillrow spread"><div><strong>${subj[s.subject]} · ${s.mode==='test'?'Kiểm tra':'Ôn tập'}</strong><div class="small">${new Date(s.date).toLocaleString('vi-VN')}</div></div><strong>${s.correct}/${s.total}</strong></div>`).join(''):'<p>Chưa có lượt học nào.</p>'}<div class="actions" style="margin-top:18px;display:flex;flex-wrap:wrap;gap:10px"><button class="secondary" id="export">💾 Sao lưu dữ liệu JSON</button><button class="secondary" id="print">🖨️ In báo cáo (chọn "Lưu thành PDF" trong hộp thoại in)</button><button class="secondary" id="import">📂 Khôi phục dữ liệu</button><button class="secondary" id="toggleSound">${soundOn?'🔊 Tắt âm thanh':'🔇 Bật âm thanh'}</button><input id="file" class="hidden" type="file" accept=".json,application/json"></div></div><p class="small">Dữ liệu trình duyệt có thể mất nếu xoá dữ liệu duyệt web. Hãy sao lưu thường xuyên.</p>`;document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thaovy-sao-luu-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)};document.getElementById('print').onclick=()=>window.print();document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('toggleSound').onclick=()=>{state.soundOn=!soundOn;save();render()};document.getElementById('file').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.attempts)||!Array.isArray(obj.sessions))throw Error('Định dạng không hợp lệ');if(!confirm('Thay thế toàn bộ dữ liệu hiện tại bằng dữ liệu đã sao lưu?'))return;state=obj;save();render()}catch(e){alert('Không đọc được file sao lưu hợp lệ.')}}}
render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
